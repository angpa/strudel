<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enjoy The Silence — Depeche Mode | Strudel</title>
    <meta name="description" content="Cover multi-capa de Enjoy the Silence de Depeche Mode usando Strudel live coding" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(160deg, #080810 0%, #12121f 40%, #0d0d1a 100%);
        color: #ccc;
        min-height: 100vh;
        display: flex; flex-direction: column; align-items: center;
        padding: 1.5rem 1rem 3rem;
      }

      /* Header */
      .header { text-align: center; margin-bottom: 1.2rem; }
      h1 {
        font-size: 1.7rem; font-weight: 700;
        background: linear-gradient(90deg, #c084fc, #818cf8, #60a5fa);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      .subtitle { color: #555; font-size: 0.8rem; font-weight: 300; margin-top: 0.2rem; }

      /* Controls */
      .controls { display: flex; gap: 10px; margin-bottom: 1rem; }
      button {
        padding: 9px 24px; font-size: 0.9rem; cursor: pointer; border: none;
        border-radius: 8px; font-weight: 600; font-family: 'Inter', sans-serif;
        transition: all 0.15s ease; letter-spacing: 0.4px;
      }
      button:hover { transform: translateY(-1px); filter: brightness(1.1); }
      button:active { transform: translateY(0); }
      #play { background: linear-gradient(135deg, #4ade80, #22c55e); color: #080810; }
      #stop { background: linear-gradient(135deg, #f87171, #ef4444); color: #fff; }

      /* Editor */
      .editor-label { color: #555; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.4rem; }
      strudel-editor {
        width: 100%; max-width: 850px; height: 560px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem; line-height: 1.6; padding: 18px;
        background: #0c0c16; color: #b8e986;
        border: 1px solid #1e1e35; border-radius: 10px;
      }
      strudel-editor:focus { outline: none; border-color: #3b3b6d; }

      /* Status + Git version */
      .footer { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 850px; margin-top: 0.6rem; }
      #status { font-size: 0.75rem; color: #444; transition: color 0.3s; }
      #status.playing { color: #4ade80; }
      #status.error { color: #f87171; }
      .git-badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem; color: #3a3a5c;
        background: #0e0e1a; border: 1px solid #1a1a30; border-radius: 6px;
        padding: 3px 10px; user-select: all;
      }
      .git-badge span { color: #6366f1; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🎹 Enjoy The Silence</h1>
      <p class="subtitle">Depeche Mode · Martin Gore · Arreglo multi-capa en Strudel</p>
    </div>

    <div class="controls">
      <button id="play">▶ Play</button>
      <button id="stop">■ Stop</button>
    </div>

    <p class="editor-label">Código Strudel · editable en vivo</p>

    <strudel-editor id="code">
      <!--
// ═══════════════════════════════════════════════════
// Enjoy the Silence — Depeche Mode
// Eb minor · 113 BPM · Depeche Mode Custom Kit
// ═══════════════════════════════════════════════════
// Instrumentos usados:
// alan_wilder_choir, martin_gore_guitar, peter_gordeno_bass, christian_eigner_kick, christian_eigner_snare, christian_eigner_hihat

stack(

  // ═══ ALAN WILDER (Choir Pad) ═══
  note("<[eb3,gb3,bb3] [b2,eb3,gb3] [gb3,bb3,db4] [db3,f3,ab3]>")
    .s("alan_wilder_choir")
    .cutoff(1500)
    .room(0.8)
    .gain(0.6),

  // ═══ MARTIN GORE (Guitarra Principal) ═══
  note("<[~ ~ bb4 bb4] [ab4 gb4 ~ ~] [~ ~ ab4 bb4] [~ ~ ~ ~]>")
    .s("martin_gore_guitar")
    .delay(0.25).delaytime(0.33)
    .gain(0.8)
    .room(0.4),

  // ═══ PETER GORDENO (Bajo Sintetizado) ═══
  note("<[eb2 eb2 eb2 eb2] [b1 b1 b1 b1] [gb2 gb2 gb2 gb2] [db2 db2 db2 db2]>")
    .s("peter_gordeno_bass")
    .cutoff(1000)
    .gain(0.7),

  // ═══ CHRISTIAN EIGNER (Batería Acústica / Híbrida) ═══
  s("christian_eigner_kick(4,4)").gain(1.0),
  s("~ christian_eigner_snare ~ christian_eigner_snare").gain(0.9),
  s("christian_eigner_hihat*8").gain(0.5).room(0.1)

).cpm(28.25)
      -->
    </strudel-editor>

    <div class="footer">
      <p id="status">Listo. Presiona Play para escuchar.</p>
      <div class="git-badge" id="git-info">cargando versión...</div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
