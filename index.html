    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);

      .section-label {
        color: #888;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 0.5rem;
      }
      textarea {

        font-size: 0.85rem;
        line-height: 1.6;

        color: #a8ff60;
        border: 1px solid rgba(99, 102, 241, 0.2);

      textarea:focus {

  <body>
    <div class="header">
      <h1>🎹 Enjoy The Silence</h1>
      <p class="subtitle">Depeche Mode · Martin Gore · Partitura completa en Strudel</p>
    </div>

    <p class="section-label">Código Strudel — editable en vivo</p>

    <textarea id="code" spellcheck="false">// ═══════════════════════════════════════════════
// Enjoy the Silence — Depeche Mode (Martin Gore)
// Partitura completa · D Major · Allegro ~113 BPM
// ═══════════════════════════════════════════════

// La partitura tiene estas secciones:
//   Intro (c.1-3) → Intro pad (c.4-7) → Segno/Pad (c.8-12)
//   → Verse (c.13-18) → Chorus (c.19-29) → Coda/Outro (c.30-37)

stack(

  // ─── MANO DERECHA (treble) ───────────────────

  cat(
    // ── Intro (compases 1-3): acordes con ritmo punteado ──
    // c.1: D dotted-8th pattern
    "[d4,fis4,a4] ~ [d4,fis4,a4] [d4,fis4,a4]",
    "[d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4]",
    "[d4,fis4,a4] ~ [d4,fis4,a4] [d4,fis4,a4]",

    // ── Intro pad (compases 4-7): acordes sostenidos ──
    "[d4,fis4,a4] ~ [d4,fis4,a4] [d4,fis4]",
    // c.5-7: whole note chords (pads)
    "[d4,fis4,a4,d5]", "[d4,fis4,a4,d5]", "[d4,fis4,a4,d5]",

    // ── Segno section (compases 8-12): pads largos ──
    "[d4,fis4,a4,d5]", "[d4,fis4,a4,d5]",
    "[d4,fis4,a4,d5]", "[d4,fis4,a4,d5]",
    "[d4,fis4,a4,d5]",

    // ── Verse (compases 13-18): melodía con acordes ──
    // c.13
    "~ [d4,fis4,a4] [d4,fis4,a4] [e4,a4] [d4,fis4] [d4,fis4]",
    // c.14
    "[d4,fis4,a4] [d4,fis4,a4] [e4,a4] [d4,fis4] [d4,fis4]",
    // c.15
    "[d4,fis4,a4] [d4,fis4,a4] [dis4,fis4,a4] [e4,a4] [d4,fis4]",
    // c.16
    "[d4,fis4,a4] ~ [d4,fis4,a4] [d4,fis4,a4] [e4,a4] [d4,fis4]",
    // c.17
    "[d4,fis4,a4] ~ [d4,fis4,a4] [d4,fis4,a4] [e4,a4] [d4,fis4]",
    // c.18
    "~ [d4,fis4,a4] [d4,fis4] [d4,fis4] [d4,fis4] [d4,fis4]",

    // ── Chorus (compases 19-25): acordes densos ──
    // c.19
    "~ [d4,fis4,a4] [d4,fis4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.20
    "[d4,fis4,a4] ~ [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.21
    "~ [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.22
    "[d4,fis4,a4] ~ [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.23
    "[d4,fis4,a4] [d4,fis4,a4] [d4,g4,a4] [d4,fis4,a4]",
    // c.24
    "~ [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.25
    "[d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4]",

    // ── Bridge/Triplets (compases 26-29) ──
    "[d4,fis4,a4] ~ [d4,fis4,a4] [d4,fis4,a4]",
    "[d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4]",
    "[c4,e4,g4,bb4] ~ [c4,e4,g4] [c4,e4,g4,bb4]",
    "[d4,fis4,a4,d5]",

    // ── Coda/Outro (compases 30-37): ritmo punteado que se repite ──
    "~ [b3,d4] [b3,d4] ~",
    "~ [b3,d4] [b3,d4] ~",
    "~ [b3,d4] [b3,d4] ~",
    "~ [b3,d4] [b3,d4] ~",
    "~ [b3,d4] [b3,d4] ~",
    "~ [b3,d4] [b3,d4] ~",
    "~ [b3,d4] [b3,d4] ~",
    "~ [b3,d4] [b3,d4] ~"
  )
  .s("triangle")
  .cutoff(2200)
  .attack(0.01)
  .decay(0.4)
  .sustain(0.3)
  .release(0.5)
  .gain(0.4)
  .room(0.4)
  .delay(0.15)
  .delaytime(0.375),

  // ─── MANO IZQUIERDA (bass) ──────────────────

  cat(
    // ── Intro (compases 1-3) ──
    "~ d2 [d2 e2] d2",
    "~ d2 [d2 e2] d2",
    "~ d2 [d2 e2] d2",

    // ── Intro pad (compases 4-7) ──
    "~ d2 [d2 e2] d2",
    "d2 ~ ~ ~",
    "d2 ~ ~ ~",
    "d2 ~ ~ ~",

    // ── Segno (compases 8-12): bajo con octavas ──
    "[~ d2] [b2 d3] ~",
    "[~ d2] [b2 d3] ~",
    "[~ d2] [b2 d3] ~",
    "[~ d2] [b2 d3] ~",
    "[~ d2] [b2 d3] ~",

    // ── Verse (compases 13-18): bajo rítmico ──
    "~ [d2 e2] d2 e2",
    "[d3 ~] [d2 e2] d2 e2",
    "[d3 ~] [d2 e2] d2 e2",
    "[d3 ~] [d2 e2] d2 e2",
    "[d3 ~] [d2 e2] d2 e2",
    "~ [d2 e2] d2 [e2 d2]",

    // ── Chorus (compases 19-25) ──
    "~ d2 [d2 b2] d2",
    "~ [d3 ~] [d2 d3] [d2 d3]",
    "~ d2 [g2 ~] d2",
    "~ d2 [d3 ~] d2",
    "~ d2 [d3 ~] d2",
    "~ d2 [d3 ~] [d2 d3]",
    "[d2 d3] [d2 d3] [d2 d3] [d2 d3]",

    // ── Bridge (compases 26-29) ──
    "~ d2 [d3 ~] d2",
    "~ [d3 ~] [d2 d3] d2",
    "d2 [bb1 ~] [bb1 ~] [bb1 ~]",
    "d2 ~ ~ ~",

    // ── Coda/Outro (compases 30-37): bajo punteado ──
    "~ [d2 ~] [b2 ~] d2",
    "~ [d2 ~] [b2 ~] d2",
    "~ [d2 ~] [b2 ~] d2",
    "~ [d2 ~] [b2 ~] d2",
    "~ [d2 ~] [b2 ~] d2",
    "~ [d2 ~] [b2 ~] d2",
    "~ [d2 ~] [b2 ~] d2",
    "~ [d2 ~] [b2 ~] d2"
  )
  .s("sawtooth")
  .cutoff(500)
  .resonance(6)
  .decay(0.25)
  .sustain(0.4)
  .release(0.3)
  .gain(0.5)

).cpm(113)</textarea>
