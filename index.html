  <body>
    <div class="header">
      <h1>🎹 Enjoy The Silence</h1>
      <p class="subtitle">Depeche Mode · Martin Gore · Partitura completa en Strudel</p>

    <textarea id="code" spellcheck="false">// ═════════════════════════════════════════════════
// Enjoy the Silence — Depeche Mode (Martin Gore)
// D Major · 4/4 · Allegro (~113 BPM)
// Transcripción completa: 37 compases, 2 páginas
// ═════════════════════════════════════════════════
// cpm(28.25) = 113 BPM / 4 beats = 1 ciclo por compás

stack(

  // ═══ MANO DERECHA (acordes + melodía) ═══════
  cat(
    // ── Intro (c.1-4): patrón punteado ──
    // negra-con-punto [A4,D4,Fis4], corchea [A4,D4,Fis4], blanca [A4,D4]
    "[a4,d4,fis4]@3 [a4,d4,fis4] [a4,d4]@4",     // c.1
    "[a4,d4,fis4]@3 [a4,d4,fis4] [a4,d4]@4",     // c.2
    "[a4,d4,fis4]@3 [a4,d4,fis4] [a4,d4]@4",     // c.3
    "[a4,d4,fis4]@3 [a4,d4,fis4] [a4,d4] [d4]",  // c.4

    // ── Pad sostenido (c.5-7): acordes enteros ──
    "[d4,fis4,a4,d5]",  // c.5
    "[d4,fis4,a4,d5]",  // c.6
    "[d4,fis4,a4,d5]",  // c.7

    // ── Segno: pads largos (c.8-12) ──
    "[d4,fis4,a4,d5]",  // c.8
    "[d4,fis4,a4,d5]",  // c.9
    "[d4,fis4,a4,d5]",  // c.10
    "[d4,fis4,a4,d5]",  // c.11
    "[d4,fis4,a4,d5]",  // c.12

    // ── Verso (c.13-18): acordes rítmicos con movimiento ──
    // c.13: 8va-rest, [B3,D4,Fis4] corchea, [B3,D4,Fis4]. punteada,
    //        [A3,D4,E4] [A3,D4,Fis4] [A3,D4,Fis4] negras
    "~ [b3,d4,fis4] [b3,d4,fis4]@3 [[a3,d4,e4] [a3,d4,fis4] [a3,d4,fis4]]",
    // c.14: natural-sign en C -> C4 natural (no C#)
    "~ [c4,e4,fis4] [c4,e4,fis4]@3 [[b3,e4] [b3,d4,fis4] [b3,d4,fis4]]",
    // c.15: pickup + D#4 cromático
    "~ [b3,d4,fis4] [b3,d4,fis4] [dis4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.16: patrón repetido
    "[b3,d4,fis4]@3 [b3,d4,fis4] [a3,d4,e4] [a3,d4,fis4] [a3,d4,fis4] [b3,d4,fis4]",
    // c.17: con C natural otra vez
    "~ [b3,e4,fis4] [b3,e4,fis4]@3 [[b3,d4,e4] [b3,d4,fis4] [b3,d4,fis4]]",
    // c.18: resolución con C natural
    "~ [c4,e4,fis4] [c4,e4,fis4]@3 [[b3,d4,e4] [b3,d4,fis4] [b3,d4,fis4]]",

    // ── Estribillo (c.19-21): acordes densos ──
    // c.19: pickup + acordes 8va repetidos
    "~ [b3,d4,fis4] [d4,fis4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.20: acordes punteados densos
    "[b3,d4,fis4]@3 [b3,d4,fis4] [d4,fis4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.21: pickup + acordes con movimiento
    "~ [b3,d4,fis4] [b3,d4,fis4]@3 [a3,d4,fis4] [a3,d4,fis4] [a3,d4,fis4]",

    // c.22: acordes punteados + resolución
    "[b3,d4,fis4]@3 [b3,d4,fis4] [d4,fis4] [a3,d4,fis4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.23: dotted half chords
    "[d4,fis4,a4]@3 [d4,fis4] [d4,fis4,a4] [d4,fis4,b4]",
    // c.24: pickup + dense chords
    "~ [b3,d4,fis4] [b3,d4,fis4]@3 [a3,d4,fis4] [a3,d4,fis4] [a3,d4,fis4]",
    // c.25: dotted half resolución
    "[b3,d4,fis4] [b3,d4,fis4] [b3,d4,a4]@3 ~",

    // ── Puente: tresillo + modulación (c.26-29) ──
    // c.26: acordes punteados repetidos
    "[b3,d4,fis4]@3 [b3,d4,fis4] [d4,fis4] [a3,d4,fis4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.27: TRESILLOS - 6 acordes en un compás
    "[d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4] [d4,fis4,a4]",
    // c.28: Bb modulación! con naturales y bemoles
    "[c4,e4,bb4] [c4,e4]@3 [c4,e4,bb4]@3 ~",
    // c.29: resolución a D mayor (acorde entero con fermata)
    "[d4,fis4,a4,d5]",

    // ── Coda/Outro (c.30-37): patrón repetido hasta fade ──
    // Patrón: silencio, B3 corchea, D4 corchea (repetido 2x por compás)
    "~ [b3 d4] ~ [b3 d4]",  // c.30
    "~ [b3 d4] ~ [b3 d4]",  // c.31
    "~ [b3 d4] ~ [b3 d4]",  // c.32
    "~ [b3 d4] ~ [b3 d4]",  // c.33
    "~ [b3 d4] ~ [b3 d4]",  // c.34
    "~ [b3 d4] ~ [b3 d4]",  // c.35
    "~ [b3 d4] ~ [b3 d4]",  // c.36
    "~ [b3 d4] ~ [b3 d4]"   // c.37
  )
  .s("triangle")
  .cutoff(2200).resonance(4)
  .attack(0.01).decay(0.35).sustain(0.35).release(0.5)
  .gain(0.4).room(0.35).delay(0.15).delaytime(0.33),


  // ═══ MANO IZQUIERDA (bajo) ═════════════════
  cat(
    // ── Intro (c.1-4): D pedal + movimiento D-E ──
    // Patrón: silencio, D3 negra, E3 corchea, D3 E3 (sobre pedal D2)
    "[~ d3 e3 d3]",         // c.1
    "[~ d3 e3 d3]",         // c.2
    "[~ d3 e3 d3]",         // c.3
    "[~ d3 e3 d3]",         // c.4

    // ── Pad (c.5-7): pedal D con patrón rítmico ──
    // Patrón: silencio, D3 corchea, B2 corchea, D3 corchea
    "[~ d3 [b2 d3]]",       // c.5
    "[~ d3 [b2 d3]]",       // c.6
    "[~ d3 [b2 d3]]",       // c.7

    // ── Segno (c.8-12): bajo con 8vas ──
    "[~ d3 [b2 d3]]",       // c.8
    "[~ d3 [b2 d3]]",       // c.9
    "[~ d3 [b2 d3]]",       // c.10
    "[~ d3 [b2 d3]]",       // c.11
    "[~ d3 [b2 d3]]",       // c.12

    // ── Verso (c.13-18): bajo más activo ──
    // c.13: rest, D2, 8th-D3, D2, D3
    "~ d2 [d3 d2] d3",
    // c.14: rest, E2, dotted-E3, E2, E3
    "~ e2 [e3 e2] e3",
    // c.15: rest, D2, 8th D3, 8th E3, D3
    "~ d2 [d3 e3] d3",
    // c.16: rest, D2, 8th-D3, D2, D3
    "~ d2 [d3 d2] d3",
    // c.17: rest, E2, dotted-E3, E2, E3
    "~ e2 [e3 e2] e3",
    // c.18: rest, E2, E3, E2, E3
    "~ e2 [e3 e2] e3",

    // ── Estribillo (c.19-21) ──
    // c.19: rest, D2, 8th D3, D2
    "~ d2 [d3 d2] d3",
    // c.20: rest, D3, half D2, D3
    "~ [d3 d2@3] d3",
    // c.21: rest, A2, dotted-half, A2
    "~ a2 [a2@3 a3]",

    // c.22: D bajo + movimiento
    "~ d2 [d3 d2] d3",
    // c.23: D pedal sostenido
    "[d2@3 d3]",
    // c.24: E bajo (subdominante)
    "~ [e2 e3 e2 e3]",
    // c.25: A bajo
    "[a2 e2 a2 a3]",

    // ── Puente (c.26-29) ──
    // c.26: D bajo
    "~ d2 [d3 d2] d3",
    // c.27: D bajo + movimiento al puente
    "~ [d3 d2@3] d3",
    // c.28: Bb! bajo con bemoles
    "d3 [bb2 bb2@3] bb2",
    // c.29: resolución a D (nota larga)
    "d2",

    // ── Coda (c.30-37): bajo punteado ──
    // Patrón: rest, D2 punteada, D3 negra
    "[~ d2@3 d3]",   // c.30
    "[~ d2@3 d3]",   // c.31
    "[~ d2@3 d3]",   // c.32
    "[~ d2@3 d3]",   // c.33
    "[~ d2@3 d3]",   // c.34
    "[~ d2@3 d3]",   // c.35
    "[~ d2@3 d3]",   // c.36
    "[~ d2@3 d3]"    // c.37
  )
  .s("sawtooth")
  .cutoff(450).resonance(5)
  .attack(0.01).decay(0.3).sustain(0.45).release(0.3)
  .gain(0.55)

).cpm(28.25)</textarea>
